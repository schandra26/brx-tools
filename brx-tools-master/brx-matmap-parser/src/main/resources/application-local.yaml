spring:
  datasource:
    driverClassName: org.h2.Driver
    username: sa
    password: 
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS public
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

server:
  port: 8080

logging:
  level:
    com.broadridge.brx.matmapparser: INFO
