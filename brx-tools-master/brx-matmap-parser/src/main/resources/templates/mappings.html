<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mappings</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .filter-form {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f8f8;
            border-radius: 5px;
        }
        .filter-form input[type="text"] {
            padding: 8px;
            margin-right: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .filter-form button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .filter-form button.reset {
            background-color: #f44336;
        }
        .loading {
            display: none;
            margin-left: 10px;
        }
        .filter-form button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
    <script>
        function showLoading() {
            const button = document.getElementById('download');
            const loading = document.getElementById('loading');

            button.disabled = true;
            button.textContent = 'Generating Excel...';
            loading.style.display = 'inline';

            // Re-enable button after 5 seconds in case download completes
            setTimeout(function() {
                button.disabled = false;
                button.textContent = 'Download as Excel';
                loading.style.display = 'none';
            }, 5000);
        }
    </script>
</head>
<body>
    <h1>Mappings</h1>

    <div class="filter-form">
        <form action="/mappings" method="get">
            <label for="filename">Filename:</label>
            <input type="text" id="filename" name="filename" th:value="${filenameFilter}" />

            <label for="source">Source:</label>
            <input type="text" id="source" name="source" th:value="${sourceFilter}" />

            <label for="target">Target:</label>
            <input type="text" id="target" name="target" th:value="${targetFilter}" />

            <button type="submit">Filter</button>
            <button type="button" class="reset" onclick="window.location.href='/mappings'">Reset Filters</button>
        </form>
    </div>

    <div class="filter-form">
        <form action="/mappings/excel" method="get" onsubmit="showLoading()">
            <button id="download" name="download" type="submit">Download as Excel</button>
            <span id="loading" class="loading">Please wait...</span>
        </form>
    </div>

    <table th:if="${not mappings.isEmpty()}">
        <thead>
            <tr>
                <th>Source File</th>
                <th>Source Field</th>
                <th>Target Field</th>
                <th>Non Brx Enumeration Metadata</th>
                <th>Last Committer</th>
                <th>Last Committed At
                <th>Scanned At</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="mapping : ${mappings}">
                <td th:text="${mapping.getFilename()}"></td>
                <td th:text="${mapping.getSourceField()}"></td>
                <td th:text="${mapping.getTargetField()}"></td>
                <td th:text="${mapping.getNonBrxEnumerationMetadata()}"></td>
                <td th:text="${mapping.getLastCommitter()}"></td>
                <td th:text="${#dates.format(mapping.getLastCommittedAt(), 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:text="${#dates.format(mapping.getCreatedAt(), 'yyyy-MM-dd HH:mm:ss')}"></td>

            </tr>
        </tbody>
    </table>

    <div th:if="${mappings.isEmpty()}">
        <p>No mappings found matching your criteria.</p>
    </div>
</body>
</html>
